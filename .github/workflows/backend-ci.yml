name: Stock Terminal Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

jobs:
  test-backend:
    name: Run Backend Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      # Tworzymy tymczasowy plik .env z wykorzystaniem bezpiecznych sekretów z GitHub
      - name: Create test .env file
        run: |
          cat << EOF > .env
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB=stock_terminal
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          SECRET_KEY=${{ secrets.CI_SECRET_KEY }}
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          EOF

      - name: Build and start Docker services
        run: docker compose up -d --build

      - name: Wait for PostgreSQL container health check
        run: |
          until docker compose exec -T db pg_isready -U postgres; do
            echo "Waiting for database connection..."
            sleep 2
          done

      - name: Run pytest test suite inside API container
        run: docker compose exec -T api pytest -v

      - name: Tear down Docker services
        if: always()
        run: docker compose down